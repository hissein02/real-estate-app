[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "DJ"]
ignore = ["E501", "B008", "DJ001"]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S101", "S105", "S106"]
"*/migrations/*" = ["E501"]

[tool.ruff.lint.isort]
known-django = ["django"]
known-drf = ["rest_framework"]
section-order = ["future", "standard-library", "django", "drf", "third-party", "first-party", "local-folder"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --reuse-db"

[tool.coverage.run]
source = ["."]
omit = ["*/migrations/*", "*/tests/*", "manage.py", "*/settings/*", "conftest.py"]
